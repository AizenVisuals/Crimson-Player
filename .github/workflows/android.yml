name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a GitHub Release after successful tests and APK build'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android host
        run: flutter create --platforms=android --org com.aizenvisuals .

      - name: Resolve dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Widget tests
        run: flutter test

      - name: Build Android preview APKs
        env:
          SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
          SPOTIFY_PUBLIC_TOKEN_URL: ${{ vars.SPOTIFY_PUBLIC_TOKEN_URL }}
          GOOGLE_SERVER_CLIENT_ID: ${{ vars.GOOGLE_SERVER_CLIENT_ID }}
          YOUTUBE_API_KEY: ${{ vars.YOUTUBE_API_KEY }}
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define="SPOTIFY_CLIENT_ID=$SPOTIFY_CLIENT_ID" \
            --dart-define="SPOTIFY_PUBLIC_TOKEN_URL=$SPOTIFY_PUBLIC_TOKEN_URL" \
            --dart-define="GOOGLE_SERVER_CLIENT_ID=$GOOGLE_SERVER_CLIENT_ID" \
            --dart-define="YOUTUBE_API_KEY=$YOUTUBE_API_KEY"

      - name: Upload test APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crimson-player-android-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Publish release ONLY when explicitly requested
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(awk '/^version:/ {sub(/^version: */, "", $0); split($0, pieces, "+"); print pieces[1]}' pubspec.yaml)"
          TAG="v$VERSION"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec.yaml $TAG"
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Bump the version; never silently overwrite."
            exit 1
          fi
          gh release create "$TAG" build/app/outputs/flutter-apk/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Crimson Player $TAG — Android Preview" \
            --generate-notes \
            --prerelease
