name: Android Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crimson-android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android host files
        run: flutter create --platforms=android --org com.aizenvisuals .

      - name: Dependencies
        run: flutter pub get

      - name: Analyze Dart
        run: flutter analyze --no-fatal-infos

      - name: Widget tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Keep APKs as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crimson-player-android-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Publish v0.2.0 release with installable APK files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.2.0
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; skipping duplicate publication."
            exit 0
          fi
          gh release create "$RELEASE_TAG" build/app/outputs/flutter-apk/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Crimson Player v0.2.0 — Android Preview" \
            --notes "Revisão visual Android com temas claro/escuro, tipografia Inter, layout minimalista inspirado nas referências aprovadas, dock com animação controlada e mini-player integrado. Artwork usa somente capas reais dos arquivos; sem capas ou waveforms fictícias. Ajustado fluxo de permissão Android 13+. Catálogo online pesquisável e desktop seguem em desenvolvimento. Para celulares Android ARM64, baixe app-arm64-v8a-release.apk." \
            --prerelease
