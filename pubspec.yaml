name: crimson_player
description: Crimson Player — música local e streaming autorizado, Android primeiro.
publish_to: none
version: 0.2.0+2

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.3.2
  media_kit: ^1.2.6
  media_kit_libs_audio: ^1.0.7
  on_audio_query_pluse: ^3.0.7
  permission_handler: ^11.4.0
  device_info_plus: ^11.5.0
  shared_preferences: ^2.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
